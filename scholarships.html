<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarships & Grants | SD Travels</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <div class="page-header">
            <div class="container">
                <h1>Scholarships & Grants</h1>
                <div class="breadcrumb">Home / Scholarships</div>
            </div>
        </div>

        <section class="section">
            <div class="container">
                <div style="display: flex; gap: 3rem;">
                    
                    <!-- Main Content -->
                    <div style="flex: 1;">
                        <div id="scholarships-feed" class="grid-2">
                            <p id="scholarships-loading" style="grid-column: 1 / -1; text-align: center; color: var(--text-light); font-size: 1.2rem; padding: 2rem;">Loading latest scholarships...</p>
                        </div>
                    </div>

                    <!-- Sidebar -->
                    <aside style="width: 300px; flex-shrink: 0;" class="desktop-only-sidebar">
                        <div style="background-color: var(--bg-light-gray); padding: 2rem; border-radius: 8px; margin-bottom: 2rem;">
                            <h3 style="margin-bottom: 1.5rem; color: var(--primary-color);">Categories</h3>
                            <ul style="display: flex; flex-direction: column; gap: 0.8rem;">
                                <li><a href="#" style="color: var(--text-charcoal);"><i class="fa-solid fa-angle-right" style="color: var(--accent-color); margin-right: 5px;"></i> Undergraduate</a></li>
                                <li><a href="#" style="color: var(--text-charcoal);"><i class="fa-solid fa-angle-right" style="color: var(--accent-color); margin-right: 5px;"></i> Masters</a></li>
                                <li><a href="#" style="color: var(--text-charcoal);"><i class="fa-solid fa-angle-right" style="color: var(--accent-color); margin-right: 5px;"></i> PhD</a></li>
                                <li><a href="#" style="color: var(--text-charcoal);"><i class="fa-solid fa-angle-right" style="color: var(--accent-color); margin-right: 5px;"></i> Fellowship</a></li>
                            </ul>
                        </div>
                    </aside>

                </div>
            </div>
        </section>
    </main>
    <script src="app.js"></script>
    <script type="module" src="js/scholarships.js"></script>
    <style>
        @media (max-width: 768px) {
            .desktop-only-sidebar { display: none; }
        }
    </style>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarship Details | SD Travels</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .detail-card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .sch-meta { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 2rem; }
        .meta-item { background: var(--bg-light-gray); padding: 0.5rem 1rem; border-radius: 50px; font-size: 0.9rem; font-weight: 500; }
        .sch-section { margin-bottom: 2rem; }
        .sch-section h3 { color: var(--primary-color); margin-bottom: 1rem; font-size: 1.2rem; border-bottom: 2px solid var(--accent-color); display: inline-block; padding-bottom: 0.2rem; }
        .share-btns a { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.5rem; border-radius: 50px; color: white; text-decoration: none; font-weight: 600; }
        .btn-whatsapp { background-color: #25D366; }
        .btn-twitter { background-color: #000000; }
        .btn-facebook { background-color: #1877F2; }
        .apply-btn { display: inline-block; background-color: var(--primary-color); color: white; padding: 1rem 2rem; border-radius: 8px; font-weight: 600; text-align: center; width: 100%; margin-top: 1rem; }
    </style>
</head>
<body>
    <main>
        <div class="page-header" style="padding: 4rem 0 2rem;">
            <div class="container">
                <div class="breadcrumb" style="margin-bottom: 1rem;"><a href="scholarships.html" style="color:var(--accent-color);">← Back to Scholarships</a></div>
            </div>
        </div>

        <section class="section">
            <div class="container">
                <div id="sch-details-container">
                    <p style="text-align: center; padding: 2rem; font-size: 1.2rem; color: #666;">Loading Scholarship Details...</p>
                </div>
            </div>
        </section>
    </main>
    <script src="app.js"></script>
    <script type="module" src="js/scholarship-details.js"></script>
</body>
</html>
